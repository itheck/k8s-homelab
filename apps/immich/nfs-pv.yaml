apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-nfs-library-pv
spec:
  capacity:
    storage: 2Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=2
  nfs:
    path: /mnt/raid1/immich   # Update to your NFS export path
    server: 192.168.1.X        # Update to your NFS Server IP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-nfs-library-pvc
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 2Ti
  volumeName: immich-nfs-library-pv
