apiVersion: apps/v1
kind: Deployment
metadata:
  name: crewai-workspace
  namespace: ai-stack
  labels:
    app: crewai-workspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crewai-workspace
  template:
    metadata:
      labels:
        app: crewai-workspace
    spec:
      containers:
      - name: crewai
        image: ghcr.io/itheck/crewai-workspace:latest
        imagePullPolicy: Never
        env:
          - name: VLLM_MODEL
            value: "Qwen/Qwen2.5-Coder-7B-Instruct-AWQ"
          - name: VLLM_BASE_URL
            value: "http://10.0.0.61:30472/v1"
          - name: QDRANT_HOST
            value: "10.0.0.51"
          - name: VLLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: vllm-api-key-secret
                key: api-key
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "256Mi"
