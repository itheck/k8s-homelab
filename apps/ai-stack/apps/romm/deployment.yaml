apiVersion: v1
kind: Namespace
metadata:
  name: games
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-db-pvc
  namespace: games
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-pvc
  namespace: games
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: games
spec:
  replicas: 1
  selector:
    matchLabels:
      app: romm
  template:
    metadata:
      labels:
        app: romm
    spec:
      containers:
      - name: romm
        image: rommapp/romm:latest
        env:
        - name: DB_HOST
          value: "romm-db"
        - name: DB_PORT
          value: "3306"
        - name: DB_USER
          value: "rommuser"
        - name: DB_PASSWD
          value: "rommpass123"
        - name: DB_NAME
          value: "romm"
        - name: ROMM_DB_DRIVER
          value: "mariadb"
        - name: ROMM_AUTH_SECRET_KEY
          value: "heckworks_secret_key_837291038"
        ports:
        - containerPort: 8080
        volumeMounts:
        - mountPath: /romm/library
          name: roms-nfs
        - mountPath: /romm/resources
          name: data
          subPath: resources
        - mountPath: /romm/config
          name: data
          subPath: config
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: romm-pvc
      - name: roms-nfs
        nfs:
          server: 10.0.0.11
          path: "/mnt/backup-hdd/Tech Projects/RetroPie"
---
apiVersion: v1
kind: Service
metadata:
  name: romm-db
  namespace: games
spec:
  ports:
  - port: 3306
  selector:
    app: romm-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: games
spec:
  replicas: 1
  selector:
    matchLabels:
      app: romm
  template:
    metadata:
      labels:
        app: romm
    spec:
      containers:
      - name: romm
        image: rommapp/romm:latest
        env:
        - name: DB_HOST
          value: "romm-db"
        - name: DB_PORT
          value: "3306"
        - name: DB_USER
          value: "rommuser"
        - name: DB_PASSWD
          value: "rommpass123"
        - name: DB_NAME
          value: "romm"
        - name: ROMM_DB_DRIVER
          value: "mariadb"
        - name: ROMM_AUTH_SECRET_KEY
          value: "heckworks_secret_key_837291038"
        ports:
        - containerPort: 8080
        volumeMounts:
        - mountPath: /romm/library
          name: data
          subPath: library
        - mountPath: /romm/resources
          name: data
          subPath: resources
        - mountPath: /romm/config
          name: data
          subPath: config
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: romm-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: romm-service
  namespace: games
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: romm
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: romm-ingress
  namespace: games
spec:
  ingressClassName: nginx
  rules:
  - host: games.heckworks.it.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: romm-service
            port:
              number: 8080
