apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-engine
  namespace: ai-stack
  labels:
    app: tei-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tei-engine
  template:
    metadata:
      labels:
        app: tei-engine
    spec:
      initContainers:
      - name: download-and-patch-nomic
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install --no-cache-dir huggingface_hub
          python -c "
          from huggingface_hub import snapshot_download
          import json

          snapshot_download('nomic-ai/nomic-embed-text-v1.5', local_dir='/data/nomic-embed-text-v1.5')

          config_path = '/data/nomic-embed-text-v1.5/config.json'
          with open(config_path, 'r') as f:
              cfg = json.load(f)

          if 'max_position_embeddings' in cfg:
              del cfg['max_position_embeddings']

          with open(config_path, 'w') as f:
              json.dump(cfg, f, indent=2)

          print('Successfully patched config.json for TEI Candle backend.')
          "
        volumeMounts:
        - name: tei-model-cache
          mountPath: /data
      containers:
      - name: tei-engine
        image: ghcr.io/huggingface/text-embeddings-inference:86-1.9
        args:
        - "--model-id"
        - "/data/nomic-embed-text-v1.5"
        - "--port"
        - "8080"
        - "--auto-truncate"
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: tei-model-cache
          mountPath: /data
      volumes:
      - name: tei-model-cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tei-engine
  namespace: ai-stack
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: tei-engine
