apiVersion: v1
kind: PersistentVolume
metadata:
  name: backup-hdd-pv
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany  # Changed from ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: /mnt/backup-hdd
    server: 10.0.0.11
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-hdd-pvc
  namespace: ai-stack
spec:
  accessModes:
    - ReadWriteMany  # Changed from ReadOnlyMany
  resources:
    requests:
      storage: 2Ti
  volumeName: backup-hdd-pv
