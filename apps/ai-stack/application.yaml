apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/YOUR_GIT_USER/k8s-homelab.git' # Replace with your Git repo URL
    targetRevision: HEAD
    path: apps/ai-stack
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ai-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
