apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: ai-stack
  labels:
    app.kubernetes.io/name: dcgm-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcgm-exporter
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true" # Adjust selector to match your GPU node label if needed
      containers:
      - name: exporter
        image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
        securityContext:
          capabilities:
            add: ["SYS_ADMIN"]
        ports:
        - name: metrics
          containerPort: 9400
        volumeMounts:
        - name: gpu-res
          mountPath: /var/lib/kubelet/device-plugins
      volumes:
      - name: gpu-res
        hostPath:
          path: /var/lib/kubelet/device-plugins
---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  namespace: ai-stack
  labels:
    app.kubernetes.io/name: dcgm-exporter
spec:
  ports:
  - name: metrics
    port: 9400
    targetPort: metrics
  selector:
    app.kubernetes.io/name: dcgm-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dcgm-exporter
  namespace: ai-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
  endpoints:
  - port: metrics
    interval: 15s
