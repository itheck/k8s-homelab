apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen-coder
  namespace: ai-stack
  labels:
    app: vllm-qwen-coder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-qwen-coder
  template:
    metadata:
      labels:
        app: vllm-qwen-coder
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.3
          args:
            - "--model"
            - "Qwen/Qwen2.5-Coder-7B-Instruct-AWQ"
            - "--quantization"
            - "awq"
            - "--gpu-memory-utilization"
            - "0.75"
            - "--max-model-len"
            - "8192"
            - "--enable-auto-tool-call"
            - "--tool-call-parser"
            - "qwen"
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
                  optional: true
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 16Gi
              cpu: "4"
            requests:
              nvidia.com/gpu: "1"
              memory: 8Gi
              cpu: "2"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-hf-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: ai-stack
spec:
  type: ClusterIP
  selector:
    app: vllm-qwen-coder
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
