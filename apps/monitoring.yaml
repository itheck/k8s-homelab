apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 61.3.0 # or latest stable
    helm:
      values: |
        grafana:
          adminPassword: "admin" # (We can seal this secret later)
          service:
            type: ClusterIP
          ingress:
            enabled: true
            ingressClassName: "traefik" # (or nginx, depending on what controller your homelab uses)
            hosts:
              - grafana.heckworks.it.com # or whatever domain/subdomain scheme you use
            path: /

        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false

        kubeControllerManager:
          enabled: true
          endpoints:
            - 10.0.0.21

        kubeScheduler:
          enabled: true
          endpoints:
            - 10.0.0.21

        kubeEtcd:
          enabled: true
          endpoints:
            - 10.0.0.21

        kubeProxy:
          enabled: true
          endpoints:
            - 10.0.0.21
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    jsonPointers:
    - /metadata/annotations
